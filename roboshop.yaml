-name: create ec2 androute53 records
hosts: all
connection: all
vars:
sg_id: sg-08842bf080121c1fa
ami_id: ami-0220d79f3f480ecf5
environment: dev
instances:
-mongodb
-catalogue
tasks: 
-name: create ec2 instance
amazon.aws.ec2_instance: 
instance_type: "t3.micro"
security_group: "{sg_id}"
image_id: "{ami_id}"
name: "{item}"
tags: 
project:roboshop
component: "{item}"
environment: "{environment}"
name: "{item-{environment}}"
loop: "{instances}"
register: ec2_output
-name: print the output
ansible.buildin.debug: 
msg: "{ec2_output}"
