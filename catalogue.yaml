---
-name:configurecatalogue service
become: yes
hosts: catalogue
tasks:
-name: enablenodejs version20
 ansible.builtin.command: dnf module enable nodejs:20 -y
 -name: Installnode js
 ansible.builtin.dnf:
 name:nodejs
 state: present
 -name: create system user roboshop
 ansible.builtin.user:
 name: roboshop
 system: true
 home: /app
 shell: /bin/nologin
 comment: "roboshop system user"
 -name: create app directory
 ansible.builtin.file
 path: /app
 state: directory
 -name: download catalogue
  ansible.builtin.get_url:
  url: https://roboshop-artifacts.s3.amazonaws.com/catalogue-v3.zip 
  dest: /tmp/catalogue.zip
  -name: unarchive catalogue
  ansible.builtin.unarchive:
  src: /tmp/catalogue.zip
  dest: /app
  -name: Install dependies
  ommunity.general.npm:
  path: /app
  -name: copy catalogueservice file
  ansible.builtin.copy
  src: catalogue.service
  dest: /etc/systemd/system/catalogue.service
  -name:copy mongo repo
  ansible.builtin.copy:
  src: mongo.repo
  dest: /etc/yum.repos.d/mongo.repo
  -name: Installmongodb client
  ansible.builtin.dnf:
  name: mongodb-mongosh
  state:present
  -name:check products loaded or not
  ansible.builtin.command: mongosh --host "{{ MONGODB_HOST }}" --quiet  --eval 'db.getMongo().getDBNames().indexOf("catalogue")'
  






