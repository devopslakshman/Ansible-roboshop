-name: mongodb configure
hosts: mongodb
become:yes
tasks:
-name: copy mongo repo
src: mongo.repo
dest: /ete/yum.repos.d/mongo.repo
-name: install mongodb server
ansible.builtin.dnf:
name: mongodb-org
    state: present
-name: start and enable mongodb
 ansible.builtin.service:
    name: mongod
    enabled: yes
    state: started
-name: allow remote connection    
ansible.builtin.replace:
path: /etc/monfod.conf
    regexp: '127.0.0.1'
    replace: '0.0.0.0'
-name: start and enable mongodb
 ansible.builtin.service:
    name: mongod
    enabled: yes
    state: started    


